# Databricks Apps: how the central app starts. Databricks sets the port and address
# through the STREAMLIT_SERVER_* environment variables; the packages come from the root
# pyproject.toml and uv.lock (not from the projects' own files).
#
# Deploy: Compute -> Apps -> the app -> Deploy, source = the root of this Git folder.
command:
  - streamlit
  - run
  - app.py

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  # Data validation: saving review decisions is off in the deployed app (its files are
  # not kept and cannot be pushed to git). That is also the default inside a Databricks
  # App; this line makes it explicit.
  - name: VALIDATION_READ_ONLY
    value: "1"
  # Boxplots: the SQL warehouse for live heads, the app resource with key
  # `sql-warehouse` (Compute -> Apps -> the app -> Edit -> App resources).
  # Off until the resource and the GRANTs from boxplots/DATA_CATALOG.md are in place;
  # until then the app shows the export in boxplots/input_data/databricks_export/.
  # To switch on: uncomment the two lines below, add the resource and redeploy.
  # - name: DATABRICKS_WAREHOUSE_ID
  #   valueFrom: sql-warehouse
