[project]
name = "wv2030-boxplots"
version = "0.1.0"
description = "Generates boxplots for monitoring wells."
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "d-geolib >=2.7.0, <3.0.0",
    "openpyxl >=3.1.5, <4.0.0",
    "numpy >= 2.3.1",
    "pandas >= 2.3.1",
    "matplotlib >= 3.10.3",
    "shapely >= 2.1.1",
    "pyproj >= 3.7.1",
    "ezdxf >= 1.4.2",
    "scipy >= 1.16.0",
    "plotly >= 6.2.0",
    # Ook nodig voor fetchall_arrow van de SQL-connector.
    "pyarrow >= 18.0.0",
    "streamlit>=1.40",
    # Live stijghoogtes uit het SQL warehouse (modules/databricks_live.py).
    "databricks-sql-connector>=4.0",
    "databricks-sdk>=0.40",
]

[tool.uv]
package = false
