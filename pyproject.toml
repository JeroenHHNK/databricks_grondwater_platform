[project]
name = "wv2030-boxplots"
version = "0.1.0"
description = "Generates boxplots for monitoring wells."
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "d-geolib >=2.7.0, <3.0.0",
    "openpyxl >=3.1.5, <4.0.0",
    "numpy >= 2.3.1",
    "pandas >= 2.3.1",
    "matplotlib >= 3.10.3",
    "shapely >= 2.1.1",
    "folium >= 0.20.0",
    "pyproj >= 3.7.1",
    "ezdxf >= 1.4.2",
    "scipy >= 1.16.0",
    "pyyaml >= 6.0.2",
    "plotly >= 6.2.0",
    # Voor het inlezen van de parquet-exports die de Databricks-notebooks
    # op het Unity Catalog-volume achterlaten.
    "pyarrow >= 18.0.0",
]

[tool.uv]
package = false
