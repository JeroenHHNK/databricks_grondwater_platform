# Groundwater data validation. Run it in the root uv environment (`uv run --project ..`):
# the central app needs the same packages, so they are locked once, in ../uv.lock.
# This file is the project's own record of what it uses, and its tool settings.
[project]
name = "databricks-data-validation"
version = "0.1.0"
description = "Groundwater timeseries validation: Databricks source copy -> git -> Streamlit review -> validated Delta table."
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "pandas >= 2.2",
    "numpy >= 1.26",
    "pyyaml >= 6.0",
    "plotly >= 6.2",
    "streamlit >= 1.66",
    "requests >= 2.31",       # local_validation/knmi.py
    "databricks-sdk >= 0.40", # scripts/run_sample_job.py
]

[dependency-groups]
dev = ["pytest >= 8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
