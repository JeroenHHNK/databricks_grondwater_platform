name: tests

# Every suite of the repo (scripts/run_tests.py), on Python 3.11 like the Databricks App.
on:
  push:
    branches: [main, development, "beta-*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install the root environment
        run: uv sync --locked
      - name: Run every test suite
        run: uv run python scripts/run_tests.py
